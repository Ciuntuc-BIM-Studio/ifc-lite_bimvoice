[package]
name = "lapin-desktop"
version = "0.1.0"
description = "Lapin desktop app: the viewer in a native Tauri window"
license = "MPL-2.0"
edition = "2021"

# Its own workspace: the repository's Cargo workspace is the IFC engine's.
[workspace]

[lib]
name = "lapin_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
percent-encoding = "2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
