name: BIMVoice test deploy (Vercel, prebuilt)

# Builds the viewer on a GitHub runner (16 GB RAM — Vercel's free 8 GB builder
# runs out of memory bundling it) and uploads the finished output to Vercel
# with `vercel deploy --prebuilt`, so Vercel compiles nothing.
#
# It publishes the docs edition (VITE_EDITION=docs: documentation of existing
# models, no modelling); the full edition is built and run locally.
#
# Needs three repository secrets (Settings → Secrets and variables → Actions):
#   VERCEL_TOKEN       a token from https://vercel.com/account/tokens
#   VERCEL_ORG_ID      "orgId" from .vercel/project.json after `vercel link`
#   VERCEL_PROJECT_ID  "projectId" from the same file
# Without them the job stops at the first step with a clear message.

on:
  push:
    branches: [feat/project-navigator]
  workflow_dispatch:

concurrency:
  group: bimvoice-vercel-deploy
  cancel-in-progress: true

jobs:
  deploy:
    if: github.repository == 'Ciuntuc-BIM-Studio/ifc-lite_bimvoice'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Check secrets
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::error::Set the VERCEL_TOKEN, VERCEL_ORG_ID and VERCEL_PROJECT_ID repository secrets."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Pinned Rust nightly + wasm-pack, as the project's own CI installs them
      # (the install script's wasm-pack installer can't write on this runner).
      - name: Setup WASM build toolchain
        uses: ./.github/actions/setup-wasm-build
        with:
          cache-prefix: bimvoice-deploy
          shared-key: bimvoice
          save-if: 'true'

      - name: Vercel CLI
        run: npm i -g vercel@latest

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      # Runs vercel.json's installCommand + buildCommand here (Rust toolchain,
      # wasm-pack, turbo build) and writes .vercel/output.
      - name: Build
        env:
          VERCEL_NODE_MAX_OLD_SPACE_MB: '8192'
          VITE_EDITION: docs
        run: |
          set -o pipefail
          vercel build --prod --token=${{ secrets.VERCEL_TOKEN }} 2>&1 | tee build.log
      # The job log needs a login; annotations are readable by anyone with the run.
      - name: Report build errors
        if: failure()
        run: |
          grep -n -i -E "error|failed|cannot|not found|exited" build.log | grep -v -i "errorboundary" | tail -40 > errors.txt || true
          tail -60 build.log >> errors.txt
          body=$(sed 's/%/%25/g' errors.txt | awk '{printf "%s%%0A", $0}')
          echo "::error title=vercel build output::${body}"

      - name: Deploy
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### Deployed: $url" >> "$GITHUB_STEP_SUMMARY"
