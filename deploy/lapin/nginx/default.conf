# Lapin: the static app (apps/viewer/dist) behind the Cloudflare tunnel.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json application/wasm image/svg+xml;

    # Hashed build files: cached for good (old builds' files stay on the server for open tabs).
    location /assets/ {
        include /etc/nginx/conf.d/headers.inc;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Coordinate systems (Project location) and the bSDD dictionaries, as the Vercel rewrites did.
    location /api/epsg/ {
        include /etc/nginx/conf.d/headers.inc;
        proxy_pass https://epsg.io/;
        proxy_ssl_server_name on;
        proxy_set_header Host epsg.io;
    }
    location /api/bsdd/ {
        include /etc/nginx/conf.d/headers.inc;
        proxy_pass https://api.bsdd.buildingsmart.org/;
        proxy_ssl_server_name on;
        proxy_set_header Host api.bsdd.buildingsmart.org;
    }

    location = /index.html {
        include /etc/nginx/conf.d/headers.inc;
        add_header Cache-Control "no-cache" always;
    }

    # The app's routes fall back to the page; a missing file with an extension is a 404.
    location / {
        include /etc/nginx/conf.d/headers.inc;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
